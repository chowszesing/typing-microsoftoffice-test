<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>初級文員電腦技能與文字輸入測試</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", "PingFang SC", sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 24px 16px;
      color: #1e293b;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 36px 32px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    h1 {
      color: #0f172a;
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 8px;
      border-bottom: 2px solid #2563eb;
      padding-bottom: 12px;
    }
    h2 {
      color: #1e40af;
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 16px;
    }
    .section {
      margin-bottom: 30px;
      padding-bottom: 24px;
      border-bottom: 1px solid #e2e8f0;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
      line-height: 1.5;
    }
    input[type="text"], input[type="email"], input[type="tel"], textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, input[type="email"]:focus, input[type="tel"]:focus, textarea:focus, select:focus {
      border-color: #2563eb;
    }
    .sample-box {
      background: #f8fafc;
      border: 1px dashed #94a3b8;
      padding: 14px 16px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 12px;
      color: #334155;
      /* 禁止選取反藍與複製 */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    .timer-badge {
      display: inline-block;
      background: #fee2e2;
      color: #b91c1c;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .btn {
      background: #2563eb;
      color: #ffffff;
      padding: 14px 20px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .notice {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>初級文員電腦技能與文字輸入測試</h1>
  <p class="notice">本測驗包含：個人基本資料登記、文字輸入速度測試（中/英）以及 Word/Excel 實務考核。請親手輸入，系統已啟用作弊監控機制。</p>

  <form id="quizForm">
    <!-- 第一部分：個人資料登記 -->
    <div class="section">
      <h2>一、 候選人資料</h2>
      <div class="form-group">
        <label for="candName">中文姓名 *</label>
        <input type="text" id="candName" required placeholder="例：LEE Ho Wai">
      </div>
      <div class="form-group">
        <label for="candPhone">聯絡電話 *</label>
        <input type="tel" id="candPhone" required placeholder="例：91234567">
      </div>
      <div class="form-group">
        <label for="candEmail">電子郵箱 *</label>
        <input type="email" id="candEmail" required placeholder="例：candidate@example.com">
      </div>
    </div>

    <!-- 第二部分：中文打字測試 -->
    <div class="section">
      <h2>二、 中文打字測驗（限時 3 分鐘）</h2>
      <div class="timer-badge" id="zhTimer">剩餘時間：03:00</div>
